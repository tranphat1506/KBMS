<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Thingent Studio Loading...</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1e293b;
            --name: #0f172a;
            --loader-bg: #f1f5f9;
            --logo-bg: #ffffff;
            --logo-border: rgba(0, 0, 0, 0.05);
            --logo-shadow: rgba(0, 0, 0, 0.1);
        }

        /* Default Dark Mode (System) */
        @media (prefers-color-scheme: dark) {
            :root:not(.theme-light) {
                --bg: #0f172a;
                --text: #f8fafc;
                --name: #f8fafc;
                --loader-bg: #1e293b;
                --logo-bg: #1e293b;
                --logo-border: rgba(255, 255, 255, 0.05);
                --logo-shadow: rgba(0, 0, 0, 0.3);
            }
        }

        /* Explicit Dark Mode (User Settings) */
        .theme-dark {
            --bg: #0f172a;
            --text: #f8fafc;
            --name: #f8fafc;
            --loader-bg: #1e293b;
            --logo-bg: #1e293b;
            --logo-border: rgba(255, 255, 255, 0.05);
            --logo-shadow: rgba(0, 0, 0, 0.3);
        }

        /* Explicit Light Mode (User Settings) Override */
        .theme-light {
            --bg: #ffffff;
            --text: #1e293b;
            --name: #0f172a;
            --loader-bg: #f1f5f9;
            --logo-bg: #ffffff;
            --logo-border: rgba(0, 0, 0, 0.05);
            --logo-shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            -webkit-app-region: drag;
            transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 28px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px -10px var(--logo-shadow);
            background: var(--logo-bg);
            border: 1px solid var(--logo-border);
            transition: all 0.4s ease;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Logo visibility logic */
        .logo-dark { display: none; }
        .logo-light { display: block; }

        @media (prefers-color-scheme: dark) {
            :root:not(.theme-light) .logo-dark { display: block; }
            :root:not(.theme-light) .logo-light { display: none; }
        }

        .theme-dark .logo-dark { display: block !important; }
        .theme-dark .logo-light { display: none !important; }
        .theme-light .logo-dark { display: none !important; }
        .theme-light .logo-light { display: block !important; }

        .app-name {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: -0.8px;
            color: var(--name);
            transition: color 0.4s ease;
        }

        .app-tagline {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            margin: 0 0 36px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .loader {
            width: 180px;
            height: 3px;
            background: var(--loader-bg);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            transition: background 0.4s ease;
        }

        .loader-bar {
            width: 35%;
            height: 100%;
            background: #10b981;
            border-radius: 10px;
            position: absolute;
            animation: loading 2s infinite cubic-bezier(0.65, 0, 0.35, 1);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes loading {
            0% { left: -35%; width: 35%; }
            50% { left: 35%; width: 50%; }
            100% { left: 100%; width: 35%; }
        }

        .version {
            position: absolute;
            bottom: 40px;
            font-size: 9px;
            font-weight: 700;
            color: #94a3b8;
            opacity: 0.6;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
    <script>
        (function() {
            try {
                const settingsStr = localStorage.getItem('thingent_studio_settings');
                if (settingsStr) {
                    const settings = JSON.parse(settingsStr);
                    if (settings.theme === 'dark') {
                        document.documentElement.classList.add('theme-dark');
                    } else if (settings.theme === 'light') {
                        document.documentElement.classList.add('theme-light');
                    }
                }
            } catch (e) {
                console.error("Theme sync failed", e);
            }
        })();
    </script>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="assets/Thingent-Icons.svg" class="logo-light" />
            <img src="assets/Thingent-Icons-Night.svg" class="logo-dark" />
        </div>
        <h1 class="app-name">Thingent Studio</h1>
        <p class="app-tagline">Data Intelligence</p>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </div>
    <div class="version">V3.4.0 Build Stable</div>
</body>

</html>
